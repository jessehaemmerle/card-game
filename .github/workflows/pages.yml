# Veröffentlicht Lunaris auf GitHub Pages, sobald etwas auf main landet.
# Einmalig nötig: Settings → Pages → Source „GitHub Actions“.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Logiktests und Bot-Simulation
        run: node tests/logic.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Seite zusammenstellen (nur das Spiel, ohne Tests und Doku)
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
